name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

# Hiox shared hosting: large zip uploads are blocked by WAF/limits.
# CI creates a GitHub Release asset; the server pulls it (small POST).
#
# One-time FileZilla upload (required again for this update):
#   app/Http/Controllers/DeployController.php
#
# Secrets:
#   DEPLOY_TOKEN  = same as server .env DEPLOY_TOKEN
#   DEPLOY_URL    = https://idaikatturshs.in/ci-deploy

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, intl, bcmath, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  build:
    name: Build assets
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 3

  deploy:
    name: Deploy to production (HTTPS)
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, gd, intl, bcmath, exif
          coverage: none
          tools: composer

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Verify deploy secrets
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Add GitHub secrets DEPLOY_URL and DEPLOY_TOKEN (see workflow comments)."
            exit 1
          fi
          echo "Deploy secrets are present."

      - name: Pack release zip
        run: |
          set -euo pipefail
          mkdir -p build
          zip -r -q build/release.zip . \
            -x "*.git*" \
            -x "*node_modules*" \
            -x "*.env" \
            -x "*.env.*" \
            -x "*tests*" \
            -x "*docker/mysql/init*" \
            -x "*storage/app*" \
            -x "*storage/framework*" \
            -x "*storage/logs*" \
            -x "*build/release.zip" \
            -x "*.phpunit.result.cache" \
            -x "*phpunit.xml" \
            -x "*docker-compose.yml"
          ls -lh build/release.zip

      - name: Publish release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="deploy-${GITHUB_RUN_ID}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/release.zip \
            --title "Deploy ${GITHUB_SHA}" \
            --notes "Automated production deploy" \
            --prerelease
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Ask server to pull release
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_API_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[0].url')"
          echo "Asset API URL obtained"

          response="$(mktemp)"
          http_code="$(curl -sS -o "$response" -w "%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "User-Agent: IdaikatturShrine-DeployBot/1.0" \
            -H "Accept: text/plain" \
            --data-urlencode "download_url=${ASSET_API_URL}" \
            --data-urlencode "github_token=${GH_TOKEN}" \
            --connect-timeout 30 \
            --max-time 900 \
            "${DEPLOY_URL}")"

          echo "HTTP ${http_code}"
          head -c 2000 "$response" || true
          echo

          if grep -qiE 'One moment, please|request is being verified|Imunify360' "$response"; then
            echo "::error::Bot protection blocked /ci-deploy. Whitelist that path in Imunify360 / ask Hiox support."
            exit 1
          fi

          if [ "$http_code" != "200" ]; then
            echo "::error::Deploy failed (HTTP ${http_code}). Re-upload updated DeployController.php via FileZilla, confirm DEPLOY_URL=https://idaikatturshs.in/ci-deploy and DEPLOY_TOKEN."
            exit 1
          fi

          grep -q '^OK deployed' "$response"
