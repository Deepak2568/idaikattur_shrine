name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

# Hiox shared hosting uses SFTP (not FTP).
# Required secrets:
#   SFTP_HOST         e.g. 103.235.104.210 or idaikatturshs.in
#   SFTP_PORT         e.g. 21478
#   SFTP_USERNAME     e.g. idaikatt
#   SFTP_PASSWORD     SFTP password from hosting panel
#   SFTP_SERVER_DIR   remote Laravel root, e.g. /public_html/ or /home/idaikatt/public_html/

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, intl, bcmath, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  build:
    name: Build assets
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 3

  deploy:
    name: Deploy to production (SFTP)
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, gd, intl, bcmath, exif
          coverage: none
          tools: composer

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Verify SFTP secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SERVER_DIR: ${{ secrets.SFTP_SERVER_DIR }}
        run: |
          missing=0
          for name in SFTP_HOST SFTP_PORT SFTP_USERNAME SFTP_PASSWORD SFTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "SFTP secrets are present."

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SERVER_DIR: ${{ secrets.SFTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

          # Normalize remote dir (ensure trailing slash)
          REMOTE_DIR="${SFTP_SERVER_DIR%/}/"

          lftp -u "${SFTP_USERNAME},${SFTP_PASSWORD}" "sftp://${SFTP_HOST}:${SFTP_PORT}" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          set mirror:parallel-transfer-count 2
          mirror -R --verbose --parallel=2 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob tests/ \
            --exclude-glob docker/mysql/init/ \
            --exclude-glob storage/app/ \
            --exclude-glob storage/framework/ \
            --exclude-glob storage/logs/ \
            --exclude-glob .phpunit.result.cache \
            --exclude-glob phpunit.xml \
            --exclude-glob docker-compose.yml \
            --exclude-glob .dockerignore \
            ./ ${REMOTE_DIR}
          bye
          EOF
