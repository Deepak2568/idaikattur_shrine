name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

# Hiox shared hosting has no SSH — deploy uses FTP from cPanel.
# Required secrets:
#   FTP_SERVER       e.g. ftp.yourdomain.com or server IP
#   FTP_USERNAME     cPanel / FTP username
#   FTP_PASSWORD     FTP password
#   FTP_SERVER_DIR   remote Laravel root, e.g. /public_html/  or /home/USER/public_html/

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, intl, bcmath, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  build:
    name: Build assets
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 3

  deploy:
    name: Deploy to production (FTP)
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, gd, intl, bcmath, exif
          coverage: none
          tools: composer

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Verify FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # Hostname only — no ftp://, https://, path, or trailing slash
          if echo "$FTP_SERVER" | grep -Eq '://|/|@'; then
            echo "::error::FTP_SERVER must be a bare hostname or IP (e.g. ftp.example.com or 1.2.3.4), not a URL."
            exit 1
          fi

          echo "Checking DNS for FTP_SERVER..."
          if ! getent hosts "$FTP_SERVER" >/dev/null 2>&1 && ! dig +short "$FTP_SERVER" A | grep -q .; then
            echo "::error::FTP_SERVER hostname does not resolve (ENOTFOUND). In cPanel → FTP Accounts, copy the exact FTP server / IP from Hiox and update the GitHub secret."
            exit 1
          fi
          echo "FTP secrets look valid."

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/tests/**
            **/docker/mysql/init/**
            **/storage/app/**
            **/storage/framework/**
            **/storage/logs/**
            **/.phpunit.result.cache
            **/.phpactor.json
            **/phpunit.xml
            **/.editorconfig
            **/docker-compose.yml
            **/.dockerignore
