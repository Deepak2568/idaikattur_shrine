name: Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

# Hiox shared hosting blocks SFTP from GitHub Actions.
# Deploy over HTTPS instead (always allowed on shared hosting).
#
# One-time manual setup (FileZilla / cPanel File Manager):
# 1. Upload public/ci-deploy.php to the live site public folder
# 2. Add to server .env:  DEPLOY_TOKEN=<long-random-string>
# 3. GitHub secrets:
#      DEPLOY_TOKEN  = same value as server .env
#      DEPLOY_URL    = https://idaikatturshs.in/ci-deploy.php
#         (use /public/ci-deploy.php if that is your public URL path)

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, intl, bcmath, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  build:
    name: Build assets
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 3

  deploy:
    name: Deploy to production (HTTPS)
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, gd, intl, bcmath, exif
          coverage: none
          tools: composer

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Verify deploy secrets
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Add GitHub secrets DEPLOY_URL and DEPLOY_TOKEN (see workflow comments)."
            exit 1
          fi
          echo "Deploy secrets are present."

      - name: Pack release zip
        run: |
          set -euo pipefail
          mkdir -p build
          zip -r -q build/release.zip . \
            -x "*.git*" \
            -x "*node_modules*" \
            -x "*.env" \
            -x "*.env.*" \
            -x "*tests*" \
            -x "*docker/mysql/init*" \
            -x "*storage/app*" \
            -x "*storage/framework*" \
            -x "*storage/logs*" \
            -x "*build/release.zip" \
            -x "*.phpunit.result.cache" \
            -x "*phpunit.xml" \
            -x "*docker-compose.yml"
          ls -lh build/release.zip

      - name: Upload release to server
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          http_code="$(curl -sS -o "$response" -w "%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -F "release=@build/release.zip" \
            --connect-timeout 30 \
            --max-time 900 \
            "${DEPLOY_URL}")"
          echo "HTTP ${http_code}"
          cat "$response"
          echo
          if [ "$http_code" != "200" ]; then
            echo "::error::Deploy endpoint failed. Confirm ci-deploy.php is uploaded, DEPLOY_TOKEN matches server .env, and PHP upload_max_filesize/post_max_size are large enough (e.g. 128M)."
            exit 1
          fi
          grep -q '^OK deployed' "$response"
